modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://github.com/rinchan-hoshino/let-your-friend-drink"
logoFile="assets/let_your_friend_drink/icon.png"

[[mixins]]
config="let_your_friend_drink.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="letyourfriendeating"
type="required"
versionRange="${friend_eating_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rinlib"
type="required"
versionRange="[1.2.0,)"
ordering="AFTER"
side="BOTH"
