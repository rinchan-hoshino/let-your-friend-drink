plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base { archivesName = "${rootProject.mod_id}-neoforge" }

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        minecraft_version_range: rootProject.minecraft_version_range,
        neo_version_range: rootProject.neo_version_range,
        loader_version_range: rootProject.loader_version_range,
        friend_eating_version_range: rootProject.friend_eating_version_range,
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_license: rootProject.mod_license,
        mod_version: rootProject.mod_version,
        mod_authors: rootProject.mod_authors,
        mod_description: rootProject.mod_description
    ]
    inputs.properties(properties)
    filteringCharset = 'UTF-8'
    expand(properties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = rootProject.neo_version
    mods {
        "${rootProject.mod_id}" { sourceSet(sourceSets.main) }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

dependencies {
    implementation "curse.maven:let-your-friend-eating-can-feed-other-player-1206957:${rootProject.friend_eating_neoforge_file}"
    implementation(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation 'io.github.llamalad7:mixinextras-neoforge:0.4.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test', Test) { useJUnitPlatform() }

def licenseFile = rootProject.file('LICENSE')
def archiveModId = rootProject.mod_id
def archiveVersion = rootProject.mod_version

tasks.named('jar', Jar) {
    from(licenseFile) { rename { "LICENSE_${archiveModId}" } }
    manifest {
        attributes(
            'Specification-Title': archiveModId,
            'Specification-Version': archiveVersion,
            'Implementation-Title': archiveModId,
            'Implementation-Version': archiveVersion
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jar')
            artifactId = "${archiveModId}-neoforge"
        }
    }
}
