name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit/property tests, verify upstream ABI, build all 8 targets, and run architecture contract tests
        env:
          JAVA_17_HOME: ${{ steps.java17.outputs.path }}
          JAVA_21_HOME: ${{ steps.java21.outputs.path }}
          JAVA_25_HOME: ${{ steps.java25.outputs.path }}
        run: python3 scripts/build-matrix.py
      - name: Run packaged-JAR E2E GameTest & Client Screen lifecycle (MC 1.21.1 NeoForge)
        env:
          JAVA_HOME: ${{ steps.java21.outputs.path }}
        run: ./gradlew :neoforge:e2eTest -Pminecraft_version=1.21.1 -Ploader=neoforge --no-configuration-cache
