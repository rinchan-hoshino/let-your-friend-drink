plugins {
    id 'java'
    id 'fabric-loom' version '1.14.10' apply false
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.143' apply false
}

def profiles = new groovy.json.JsonSlurper().parse(file('profiles.json'))
def selected = providers.gradleProperty('minecraft_version').get()
def target = profiles[selected]
if (target == null) throw new GradleException("Unsupported Minecraft profile: ${selected}")

ext.java_version = target.java
ext.api_layer = target.api
ext.forge_version = target.forge ?: ''
ext.neo_version = target.neo ?: ''
ext.minecraft_version_range = target.range
ext.fabric_minecraft_range = target.fabric_range
ext.neo_version_range = target.neo ? "[${target.neo},)" : ''
ext.lyfe_targets = target.lyfe ?: [:]

ext.ensureLyfeJar = { String loaderName ->
    def entry = ext.lyfe_targets[loaderName]
    if (entry == null) return null
    def cacheDir = rootProject.file('build/deps/lyfe')
    cacheDir.mkdirs()
    def jarFile = new File(cacheDir, entry.file as String)
    if (!jarFile.isFile() || jarFile.length() == 0L) {
        def conn = new URL(entry.url as String).openConnection()
        conn.setRequestProperty('User-Agent', 'let-your-friend-drink/2.0.0')
        conn.inputStream.withCloseable { input ->
            jarFile.withOutputStream { output -> output << input }
        }
    }
    return jarFile
}

ext.ensureClothConfigNeoForgeJar = {
    def cacheDir = rootProject.file('build/deps/e2e')
    cacheDir.mkdirs()
    def jarFile = new File(cacheDir, 'cloth-config-15.0.140-neoforge.jar')
    if (!jarFile.isFile() || jarFile.length() == 0L) {
        def conn = new URL('https://cdn.modrinth.com/data/9s6osm5g/versions/izKINKFg/cloth-config-15.0.140-neoforge.jar').openConnection()
        conn.setRequestProperty('User-Agent', 'let-your-friend-drink/2.0.0')
        conn.inputStream.withCloseable { input ->
            jarFile.withOutputStream { output -> output << input }
        }
    }
    return jarFile
}

group = mod_group_id
version = mod_version

repositories { mavenCentral() }

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets {
    main {
        java {
            srcDir 'common/src/main/java'
            include 'dev/rinchan/letyourfrienddrink/FriendDrinkPolicy.java'
            include 'dev/rinchan/letyourfrienddrink/config/**'
        }
    }
    test.java.srcDir 'common/src/test/java'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    exclude '**/ArchitectureContractTest.class'
}

tasks.register('architectureTest', Test) {
    description = 'Runs automated architecture contract assertions against built mod JARs.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ArchitectureContractTest.class'
    systemProperty 'lyfd.repo.root', rootProject.projectDir.absolutePath
    def auditDir = providers.systemProperty('lyfd.audit.dir').orNull
    if (auditDir != null) {
        systemProperty 'lyfd.audit.dir', auditDir
    } else {
        subprojects.each { sub ->
            dependsOn("${sub.path}:assemble")
        }
    }
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('architectureTest')
    if (rootProject.minecraft_version == '1.21.1' && findProject(':neoforge') != null) {
        dependsOn ':neoforge:e2eTest'
    }
}

tasks.named('jar') { enabled = false }

subprojects {
    layout.buildDirectory = rootProject.layout.projectDirectory.dir("build/profiles/${rootProject.minecraft_version}/${project.name}")
    group = rootProject.mod_group_id
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            rename { "LICENSE_${rootProject.mod_id}" }
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release.set(rootProject.java_version as int)
        }
    }
}
